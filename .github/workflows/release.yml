name: Release

# Push a tag like v0.9.0 to build installers for every platform, or run this
# manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Both jobs upload into the same draft release; running them one at a
      # time avoids two jobs racing to create it.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
          # Built on the oldest supported Ubuntu on purpose: an AppImage links
          # against the glibc of the machine that built it, so building on a
          # newer distro would refuse to start on older ones.
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build

      # linuxdeploy copies the build host's libwayland into the AppDir. On a
      # host with newer wayland (Arch, Fedora rawhide) the system Mesa EGL is
      # then loaded next to Ubuntu's older libwayland-client and initialisation
      # fails with "Could not create default EGL display: EGL_BAD_PARAMETER",
      # so the app aborts before its window appears. These libraries are part
      # of the graphics stack and must come from the host, never the bundle.
      - name: Unbundle host graphics libraries from the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri/target/release/bundle/appimage
        run: |
          set -euo pipefail
          APPIMAGE="$(ls ./*.AppImage)"
          echo "Repacking $APPIMAGE"
          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract > /dev/null
          rm -fv squashfs-root/usr/lib/libwayland-*.so.*
          wget -q -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool
          ls -lh ./*.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
          name: 'Flowchart & Pseudocode Studio 0.9.0'
          body: 'Windows installer (.exe), Linux AppImage and .deb are attached below.'
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
