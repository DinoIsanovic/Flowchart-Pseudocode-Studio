<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#1D3557" />
  <!-- Background grid accent -->
  <circle cx="256" cy="256" r="210" fill="#2E4A75" opacity="0.4" />
  
  <!-- Start Node (Pill) -->
  <rect x="176" y="60" width="160" height="54" rx="27" fill="#D7F0EC" stroke="#FFFFFF" stroke-width="6" />
  <text x="256" y="95" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1D3557" text-anchor="middle">START</text>

  <!-- Arrow 1 -->
  <line x1="256" y1="114" x2="256" y2="160" stroke="#FFFFFF" stroke-width="6" marker-end="url(#arrow)" />
  <polygon points="256,168 246,150 266,150" fill="#FFFFFF" />

  <!-- Process Node (Rectangle) -->
  <rect x="146" y="170" width="220" height="60" rx="10" fill="#FFFFFF" stroke="#D7F0EC" stroke-width="5" />
  <text x="256" y="207" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1D3557" text-anchor="middle">PROCESS (A = B + C)</text>

  <!-- Arrow 2 -->
  <polygon points="256,278 246,260 266,260" fill="#FFFFFF" />
  <line x1="256" y1="230" x2="256" y2="270" stroke="#FFFFFF" stroke-width="6" />

  <!-- Decision Node (Diamond) -->
  <polygon points="256,280 376,340 256,400 136,340" fill="#FFE8C7" stroke="#FFFFFF" stroke-width="6" />
  <text x="256" y="347" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1D3557" text-anchor="middle">IF A > 0 ?</text>

  <!-- Arrow branch Yes -->
  <line x1="256" y1="400" x2="256" y2="444" stroke="#FFFFFF" stroke-width="6" />
  <polygon points="256,452 246,434 266,434" fill="#FFFFFF" />

  <!-- End Node -->
  <rect x="186" y="454" width="140" height="42" rx="21" fill="#D7F0EC" stroke="#FFFFFF" stroke-width="5" />
  <text x="256" y="481" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1D3557" text-anchor="middle">END</text>
</svg>
