[package]
name = "flowchart-studio"
version = "0.9.0"
description = "Bi-directional flowchart and pseudocode editor"
authors = ["Dino Isanović"]
license = "Apache-2.0"
repository = "https://github.com/DinoIsanovic/Flowchart-Pseudocode-Studio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
